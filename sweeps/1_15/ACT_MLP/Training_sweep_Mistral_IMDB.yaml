program: ./foundation_main.py
project: ACT-ViT

method: grid  # Using grid search to exhaustively find the best hyperparameters

metric:
  name: best_val_AUC  # Using validation AUC to evaluate performance
  goal: maximize  # We want to maximize the validation AUC

parameters:
  # Training settings
  num_epochs:
    values: [15]
  batch_size:
    values: [128]
  seed:
    values: [0, 1, 2]

 # Model architecture
  probe_model:
    values: ["ACT-MLP-foundation"]
  hidden_dim:
    values: [128, 1024]
  num_layers:
    values: [1, 3]
  heads: # NOTE: This parameter is not used for ACT-MLP
    values: [4]
  dropout:
    values: [0.3]

  # Optimization settings
  lr:
    values: [0.001]
  weight_decay:
    values: [1, 0.001]

  # Dataset and input settings
  train_dataset:
    values:
      - "mistralai/Mistral-7B-Instruct-v0.2:imdb"
  test_dataset:
    values:
      - "mistralai/Mistral-7B-Instruct-v0.2:imdb_test"

  num_workers:
    values: [4]
  pin_memory:
    values: [1]
  down_sample_strategy:
    values: ["pool"]
  patch_size: # NOTE: This parameter is not used for ACT-MLP
    values: 
      - (1, 1)

  # Paths
  base_pre_processed_data_dir:
    values: ['PLACEHOLDER_BASE_PRE_PROCESSED_DATA_DIR']


  # Hardware settings
  cuda_idx:
    values: [0]

